name: Tag has a release

on:
  push:
    tags: ['**']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every tag since the rule started has a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          DELETED: ${{ github.event.deleted }}
          TAG: ${{ github.ref_name }}
          SINCE: '2026-10-20'
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            [ "$DELETED" = true ] && exit 0
            for _ in $(seq 30); do
              gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 && { echo "$TAG has a release"; exit 0; }
              sleep 10
            done
            echo "::error::Tag $TAG has no GitHub release. Create tags with tag-release, which makes the tag and the release together."
            exit 1
          fi
          gh release list -R "$REPO" --exclude-drafts --limit 5000 --json tagName -q '.[].tagName' | sort > released
          gh api graphql --paginate -f owner="${REPO%/*}" -f name="${REPO#*/}" -f query='
            query($owner: String!, $name: String!, $endCursor: String) {
              repository(owner: $owner, name: $name) {
                refs(refPrefix: "refs/tags/", first: 100, after: $endCursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes { name target { ... on Tag { tagger { date } } ... on Commit { committedDate } } }
                }
              }
            }' --jq '.data.repository.refs.nodes[] | [.name, (.target.tagger.date // .target.committedDate // "")] | @tsv' > tags
          missing=$(awk -F'\t' -v s="$SINCE" '$2 >= s { print $1 }' tags | sort | comm -23 - released)
          if [ -n "$missing" ]; then
            echo "$missing" | while read -r t; do echo "::error::Tag $t has no GitHub release"; done
            exit 1
          fi
          echo "All $(awk -F'\t' -v s="$SINCE" '$2 >= s' tags | wc -l | tr -d ' ') tags since $SINCE have releases."
